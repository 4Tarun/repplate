<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepPlate</title>
  <meta name="description" content="Personal gym + diet tracker: beginner workouts, Indian meal plan, protein, water and progress.">
  <meta name="theme-color" content="#f2541b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bare">
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>RepPlate</span></div>
      <button id="avatar" class="avatar" aria-label="Me and settings">·</button>
    </header>
    <nav class="tabs">
      <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
      <button data-tab="gym"><svg viewBox="0 0 24 24"><path d="M2 10h2V8h2v8H4v-2H2zM20 10h2v4h-2v2h-2V8h2zM7 6h3v12H7zM14 6h3v12h-3zM10 11h4v2h-4z"/></svg><span>Gym</span></button>
      <button data-tab="diet"><svg viewBox="0 0 24 24" class="stroke"><path d="M3 12h18a9 9 0 0 1-18 0zM7 9c0-2 2-2 2-4M12 9c0-2 2-2 2-4M17 9c0-2 2-2 2-4"/></svg><span>Diet</span></button>
      <button data-tab="progress"><svg viewBox="0 0 24 24" class="stroke"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg><span>Progress</span></button>
      <button data-tab="coach"><svg viewBox="0 0 24 24" class="stroke"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg><span>Coach</span></button>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
